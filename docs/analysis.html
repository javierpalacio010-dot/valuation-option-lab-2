<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extended Analysis · Valuation-to-Option Pricing Lab</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--navy:#0b2747;--navy2:#173f68;--ink:#10243d;--muted:#5b6f85;--bg:#eef3f8;--line:#d6e1eb;--teal:#0fa99d;--blue:#197ba6;--gold:#e2a72d;--orange:#f2762e;--red:#d94d4d;--green:#187457;--shadow:0 10px 28px rgba(11,39,71,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:24px max(18px,calc((100vw - 1400px)/2));border-bottom:4px solid var(--teal)}
.hero h1{margin:4px 0;font-size:28px}.hero p{margin:0;opacity:.85}.hero a{color:#9fe3dc}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8}
main{max-width:1400px;margin:0 auto;padding:20px 16px;display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
h2{margin:0 0 4px;font-size:18px}.caption{margin:0 0 10px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi .label{font-size:11px;letter-spacing:.08em;color:var(--muted)}.kpi .value{font-size:26px;font-weight:700;margin:4px 0}.kpi .hint{font-size:12px;color:var(--muted)}
.plot{height:340px}.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.badge{border-radius:10px;padding:10px 12px;border:1px solid var(--line);font-size:13px}.badge b{display:block;margin-bottom:3px}
.badge.pass{background:#eaf7f1;border-color:#b8e2cf}.badge.warn{background:#fff6e6;border-color:#f1d49a}
.badge .tag{float:right;font-size:11px;font-weight:700;letter-spacing:.06em}.pass .tag{color:var(--green)}.warn .tag{color:#a36a00}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}.error{background:#fdecec;border:1px solid #f3b9b9;padding:16px;border-radius:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="hero"><div class="eyebrow">SUPPLEMENTARY ANALYSIS</div><h1>Extended Model Diagnostics</h1><p id="meta">Loading…</p><p style="margin-top:6px"><a href="index.html">← Main dashboard</a></p></header>
<main id="app"><div class="card">Loading validated notebook results…</div></main>
<script>
const C={navy:'#0b2747',blue:'#197ba6',teal:'#0fa99d',gold:'#e2a72d',orange:'#f2762e',red:'#d94d4d',slate:'#68798e'};
const cfg={responsive:true,displayModeBar:false};const money=v=>v==null?'—':'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const pct=(v,d=1)=>v==null?'—':(v*100).toFixed(d)+'%';
const base={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter,Segoe UI,Arial',size:12,color:'#10243d'},margin:{l:60,r:20,t:20,b:50},xaxis:{gridcolor:'#e2e9f0',automargin:true},yaxis:{gridcolor:'#e2e9f0',automargin:true},showlegend:false};
fetch('model_results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('model_results.json was not generated');return r.json()}).then(D=>{
const m=D.model,E=D.extended;if(!E)throw Error('This model_results.json has no extended section. Re-run the notebook.');
meta.textContent=`${m.company} · ${m.ticker} · ${m.valuation_date} · ${m.exercise_style} ${m.option_type}, K=${money(m.strike)}, T=${m.maturity_years}y`;
const V=E.volatility_card,B=E.black_scholes,X=E.mispricing,K=E.kde,dd=E.distribution_diagnostics;
const kpis=[['CRR LATTICE',money(D.lattice.price),`${m.lattice_steps} steps`],['BLACK-SCHOLES',money(B.price),`CRR − BSM ${B.crr_minus_bsm>=0?'+':''}${B.crr_minus_bsm.toFixed(4)}`],['MARKET MID vs CRR',(X.market_mid_minus_crr>=0?'+':'')+money(X.market_mid_minus_crr),`${pct(X.market_mid_vs_crr_pct,2)} · ${X.crr_inside_bid_ask?'inside':'outside'} bid–ask`],['KDE BELIEF VALUE',money(K.value),`95% CI ${money(K.bootstrap_95ci[0])}–${money(K.bootstrap_95ci[1])}`]];
const sensKeys=Object.keys(E.sensitivity);
app.innerHTML=`<section class="grid4">${kpis.map(k=>`<div class="card kpi"><div class="label">${k[0]}</div><div class="value">${k[1]}</div><div class="hint">${k[2]}</div></div>`).join('')}</section>
<section class="card"><h2>Model-risk checks</h2><p class="caption">Generated automatically by the notebook. Warnings are prompts for the memo, not failures.</p><div class="badges">${E.model_risk.map(r=>`<div class="badge ${r.status}"><span class="tag">${r.status==='pass'?'✓ PASS':'⚠ WARN'}</span><b>${r.check}</b>${r.detail}</div>`).join('')}</div></section>
<section class="grid2"><article class="card"><h2>Lattice convergence</h2><p class="caption">CRR price by number of steps against the Black-Scholes-Merton closed form</p><div id="conv" class="plot"></div></article>
<article class="card"><h2>Volatility</h2><p class="caption">Input volatility versus what the market quote and analysts imply</p>
<div class="grid2" style="gap:10px;margin-bottom:8px"><div class="kpi"><div class="label">INPUT (${(V.type||'').toUpperCase()})</div><div class="value" style="color:${C.blue}">${pct(V.input)}</div></div><div class="kpi"><div class="label">IMPLIED FROM MIDPOINT</div><div class="value" style="color:${C.orange}">${pct(V.implied_from_mid,2)}</div><div class="hint">bid ${pct(X.implied_vol_bid)} · ask ${pct(X.implied_vol_ask)}</div></div></div>
<div class="hint" style="font-size:13px;color:#5b6f85">Analyst log dispersion: <b>${pct(V.analyst_log_dispersion)}</b>. Vega: each 1-point change in volatility moves the option by about <b>${money(V.vega_per_vol_point)}</b>.</div><div id="volsens" class="plot" style="height:230px"></div></article></section>
<section class="grid2"><article class="card"><h2>Simulated terminal prices (KDE)</h2><p class="caption">${K.n_sim.toLocaleString()} draws from a kernel density of analyst targets · ${pct(K.prob_itm)} finish in the money</p><div id="kde" class="plot"></div></article>
<article class="card"><h2>Scenario-weight sensitivity</h2><p class="caption">Five-state discounted expected payoff under alternative weights, with the KDE value and CRR for reference</p><div id="weights" class="plot"></div></article></section>
<section class="card"><h2>Sensitivity tables</h2><p class="caption">CRR price changing one input at a time</p><div class="grid2">${sensKeys.map(k=>`<div class="scroll"><table><thead><tr><th>${k.replace(/_/g,' ')}</th><th>Option value</th><th>Δ vs base</th></tr></thead><tbody>${E.sensitivity[k].map(r=>`<tr><td>${k.includes('vol')||k.includes('rate')?pct(r.input,1):k==='maturity_years'?r.input.toFixed(2)+'y':money(r.input)}</td><td>${money(r.price)}</td><td>${(r.price-D.lattice.price>=0?'+':'')+(r.price-D.lattice.price).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div></section>
<section class="grid2"><article class="card"><h2>Analyst distribution diagnostics</h2><div class="scroll"><table><tbody>${[['Skewness',dd.skewness.toFixed(3)],['Excess kurtosis',dd.excess_kurtosis.toFixed(3)],['Interquartile range',money(dd.iqr)],['Coefficient of variation',pct(dd.coefficient_of_variation)],['Tukey fences',`${money(dd.lower_fence)} – ${money(dd.upper_fence)}`],['Outliers',dd.tukey_outliers.length?dd.tukey_outliers.map(money).join(', '):'None'],['Share of targets above spot',pct(dd.share_above_spot,0)],['Share of targets above strike',pct(dd.share_above_strike,0)],['Publication span',dd.publication_span_days+' days'],['Horizon alignment gap',E.maturity_alignment.alignment_gap_years.toFixed(2)+' years']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></article>
<article class="card"><h2>DCF build</h2>${E.dcf?`<p class="caption">Built value ${money(E.dcf.value_per_share)} per share vs reported ${money(E.dcf.reported_dcf_value)} · terminal value ${pct(E.dcf.terminal_share_of_ev,0)} of EV · WACC ${pct(E.dcf.wacc)} · g ${pct(E.dcf.terminal_growth)}</p><div class="scroll"><table><thead><tr><th>Year</th><th>Revenue</th><th>EBIT</th><th>FCFF</th><th>PV FCFF</th></tr></thead><tbody>${E.dcf.projection.map(r=>`<tr><td>${r.year}</td><td>${r.revenue.toFixed(0)}</td><td>${r.ebit.toFixed(0)}</td><td>${r.fcff.toFixed(0)}</td><td>${r.pv_fcff.toFixed(0)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="caption">No data/dcf_inputs.csv provided.</p>'}</article></section>
<section class="card"><h2>Source documentation audit</h2><p class="caption">${E.source_audit.complete?'All inputs documented with sources and URLs.':'Replace synthetic or unsourced inputs before submission.'}</p><div class="scroll"><table><tbody><tr><td>Synthetic inputs</td><td>${E.source_audit.synthetic_inputs.join(', ')||'None'}</td></tr><tr><td>Missing source URL</td><td>${E.source_audit.missing_url.join(', ')||'None'}</td></tr><tr><td>Analyst targets synthetic</td><td>${E.source_audit.analyst_targets_synthetic?'Yes':'No'}</td></tr></tbody></table></div></section>`;
Plotly.newPlot('conv',[{x:D.convergence.map(c=>c.steps),y:D.convergence.map(c=>c.price),mode:'lines+markers',line:{color:C.blue,width:3},marker:{size:9},hovertemplate:'%{x} steps<br>%{y:$.4f}<extra></extra>'}],{...base,xaxis:{...base.xaxis,type:'log',title:'Lattice steps',tickvals:D.convergence.map(c=>c.steps),ticktext:D.convergence.map(c=>String(c.steps))},yaxis:{...base.yaxis,title:'Option value',tickprefix:'$'},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:B.price,y1:B.price,line:{color:C.orange,dash:'dot',width:2}}],annotations:[{xref:'paper',x:1,y:B.price,text:'Black-Scholes '+money(B.price),showarrow:false,yanchor:'bottom',xanchor:'right',font:{color:C.orange}}]},cfg);
const vs=E.sensitivity.volatility;Plotly.newPlot('volsens',[{x:vs.map(r=>r.input*100),y:vs.map(r=>r.price),mode:'lines+markers',line:{color:C.teal,width:3},hovertemplate:'σ %{x:.0f}%<br>%{y:$.2f}<extra></extra>'}],{...base,margin:{l:55,r:15,t:10,b:40},xaxis:{...base.xaxis,title:'Volatility (%)'},yaxis:{...base.yaxis,tickprefix:'$'}},cfg);
const ed=K.histogram.edges,mid=ed.slice(0,-1).map((e,i)=>(e+ed[i+1])/2);Plotly.newPlot('kde',[{type:'bar',x:mid,y:K.histogram.counts,marker:{color:mid.map(x=>(m.option_type==='call'?x>m.strike:x<m.strike)?C.teal:'#c9d6e2')},hovertemplate:'%{x:$.0f}: %{y} draws<extra></extra>'}],{...base,bargap:.05,xaxis:{...base.xaxis,title:'Terminal price',tickprefix:'$'},yaxis:{...base.yaxis,title:'Draws'},shapes:[{type:'line',x0:m.strike,x1:m.strike,yref:'paper',y0:0,y1:1,line:{color:C.gold,width:2,dash:'dash'}},{type:'line',x0:m.spot,x1:m.spot,yref:'paper',y0:0,y1:1,line:{color:C.navy,width:2,dash:'dot'}}],annotations:[{x:m.strike,yref:'paper',y:1,text:'Strike',showarrow:false,yanchor:'bottom',font:{color:C.gold}},{x:m.spot,yref:'paper',y:1,text:'Spot',showarrow:false,yanchor:'bottom'}]},cfg);
const W=E.weight_sensitivity,wn=['Disclosed weights','Equal weights','Data-implied weights','KDE simulation','CRR lattice','Market mid'],wv=[W.disclosed,W.equal,W.data_implied,K.value,D.lattice.price,m.market_mid];
Plotly.newPlot('weights',[{type:'bar',x:wn,y:wv,marker:{color:[C.teal,C.teal,C.teal,C.gold,C.blue,C.orange]},text:wv.map(money),textposition:'outside',cliponaxis:false,hovertemplate:'%{x}<br>%{text}<extra></extra>'}],{...base,margin:{l:55,r:15,t:30,b:80},yaxis:{...base.yaxis,tickprefix:'$'}},cfg);
}).catch(e=>app.innerHTML=`<div class="error"><b>Extended results are unavailable.</b><p>${e.message}</p></div>`);
</script></body></html>
